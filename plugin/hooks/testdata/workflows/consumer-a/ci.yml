name: CI

# Generated by agentic-ci skill, adapted for consumer-a: pnpm + turborepo. CI runs
# only on the self-hosted fleet (2 ARM64 Docker runners on the maintainer's Mac,
# `consumer-a-local-1..2`, managed by `~/consumer-a-runner/recreate-runner.sh`) — by
# decision (2026-08-21) there is no hosted fallback; if the fleet is down, CI
# waits, and `watchdog.sh` heals it.
#
# FLEET SHAPE (2026-08-26, was 3 flat runners). Runners are fenced by label:
# `consumer-a-local-1` carries `general`+`checks`, `consumer-a-local-2` carries ONLY
# `e2e`. So the two long jobs (`checks`, `review`) share runner 1 and serialize
# against each other, and NOTHING can squat on the e2e runner. The short jobs
# (`changes`, `ci-status`, and audit-gate via AUDIT_GATE_RUNNER) stay on plain
# `self-hosted` and float onto whichever runner is free — they are 15-60 s, and
# `changes` GATES e2e, so fencing it would delay the job this shape protects.
# WHY: on 2026-08-26 an 8m17s `review` job held the e2e-labelled runner and an
# e2e job ready at 18:42 could not start until 18:50 (run 33001098041 — 24m15s
# wall for a 15m28s suite). Three runners x five job types also ran the Mac at
# ~1.8x oversubscription (load 17.79) while e2e still queued behind review.
# The label names must match `recreate-runner.sh`; changing one without the
# other queues jobs forever against a label no runner carries. Two jobs carry the actual work: `checks`
# (lint, token lint, typecheck, build, vitest) and `e2e` (Playwright against
# real workerd, with postgres + mailpit + neon wsproxy as service containers,
# same as prod). A third, `ci-status`, is a bash-only aggregator.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NO_COLOR: "1"
  FORCE_COLOR: "0"
  CI: "true"

jobs:
  # Which lane is this change in? `roadmap-only` (backlog files, docs, markdown —
  # nothing e2e tests) lets the e2e job skip; anything else, and any uncertainty,
  # is `code` and runs everything. Classified by the VENDORED
  # .github/scripts/ci-lane.sh — the same script sweap's pre-merge-gate.sh runs
  # on the PR's own file list before it accepts a skipped e2e as green, so the
  # lane CI took and the lane the merge gate accepts cannot drift apart.
  # Allowlist and fail-closed by construction (see the script's header).
  #
  # WHY (research memo, sweap docs/research/2026-08-22): on THIS repo a docs-only
  # PR ran 24.8 min of e2e, and every merge re-runs CI on the push event — two
  # e2e cycles per captured backlog item, on runners that share the agents'
  # 10-core Mac. That price is what pushed sessions to bundle backlog files onto
  # unrelated feature branches (#181). The playbook's rule against that holds
  # only while the sanctioned path is the cheap one.
  #
  # Self-hosted like the rest of CI (2026-08-21 decision: no hosted fallback) —
  # it is a seconds-long bash job and runs on any of the three runners.
  # NEVER gate `checks` or audit-gate on this output — a job skipped by an `if:`
  # reports SUCCESS, and the merge gate denies a PR where a gate check is SKIPPED.
  # Only e2e is allowed to skip, and only on this lane.
  changes:
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # the lane is a diff against the base; a shallow clone can't compute it
      - id: lane
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          LANE=.github/scripts/ci-lane.sh
          if [ ! -f "$LANE" ]; then
            echo "::warning::$LANE is missing (sweap's scaffold vendors it) — running the full lane"
            echo "lane=code" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "${BASE_REF:-}" ]; then
            git fetch -q --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            lane="$(bash "$LANE" --base "origin/${BASE_REF}")"
          else
            # push to main: the landed commit's own change (a squash merge is one commit)
            lane="$(bash "$LANE" --base HEAD^)"
          fi
          echo "lane: $lane"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

  # Everything that is not Playwright, in one job: lint, token lint, typecheck, build,
  # vitest. Each gate runs even if an earlier one failed (`!cancelled()`), so one run
  # reports every failure; the job fails if any step failed.
  checks:
    # `checks` label, not plain `self-hosted`: only `consumer-a-local-1` carries it, so
    # checks jobs run ONE AT A TIME and can never land on the e2e runner. Before
    # 2026-08-26 they spread across the fleet, and a 10-minute `checks` (16:26-16:37,
    # normally 2-4 min) overlapping an e2e stretched that e2e to 25m10s — 84% of the
    # then-30-minute budget. `general` and `checks` are separate labels on runner 1 on
    # purpose: if a second `general` runner is ever added, checks stays serial.
    runs-on: [self-hosted, checks]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          APPEND_PORT: "postgres:5432"
          ALLOW_ADDR_REGEX: ".*"
        ports:
          - 5433:80
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
      - name: Create app_user role (F0 bootstrap equivalent)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE app_user LOGIN PASSWORD 'app_user'"
      - run: just db-setup
      - run: just lint
      - if: ${{ !cancelled() }}
        run: just format-check
      - if: ${{ !cancelled() }}
        run: just typecheck
      - if: ${{ !cancelled() }}
        run: just build
      - if: ${{ !cancelled() }}
        run: just test
      - if: always()
        run: bash .github/scripts/ci-status.sh checks ${{ job.status }} >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: [changes]
    # Skips ONLY on the roadmap-only lane (see `changes`). `!cancelled()` rather
    # than the implicit success() so a failed `changes` job (empty output) still
    # runs e2e — uncertainty runs the suite, never skips it.
    if: ${{ !cancelled() && needs.changes.outputs.lane != 'roadmap-only' }}
    # Only ONE runner carries the `e2e` label (consumer-a-local-2, see recreate-runner.sh),
    # and since 2026-08-26 it carries NOTHING ELSE. Two properties, not one: e2e jobs
    # serialize through GitHub's queue (the next waits, nothing is cancelled), AND no
    # other job can occupy the runner e2e is waiting for. The second half was missing
    # until 2026-08-26 and cost 8 minutes of dead queue time to a `review` job.
    # An e2e job is sized for the whole machine (4 preview servers + 4 browsers, ~4 GB);
    # 2026-08-22: three concurrently on the 14 GB VM thrashed the box — 55 s per test,
    # every job killed at its timeout, every kill re-run.
    runs-on: [self-hosted, e2e]
    # A HANG-CATCHER, NOT A CAPACITY DIAL. This is the whole reason for the number.
    # 20, then 30, were each sized to "how contended is the Mac this month", so each
    # had to be re-tuned when the load or the suite changed — and every re-tune is an
    # edit to this file, which the merge gate denies to every agent, which makes it a
    # human hand-off (roadmap DP.3). A timeout sized to catch a WEDGE never needs
    # re-tuning, so this is the last one.
    #
    # Measured 2026-08-26, six runs: healthy e2e is 13m06s-15m28s (the "~6 min on an
    # idle fleet" this comment used to claim had been stale for a while — the floor
    # that day was 13m06s, and a near-solo main push took 13m59s). Worst observed
    # under contention: 25m10s, i.e. 84% of the old 30-minute budget, on a suite that
    # did not yet include DS.5.5's 21-route mobile floor walk.
    #
    # 60 is picked so that no amount of overlap this 10-core Mac can produce reaches
    # it — ~4x the healthy run. A kill here should mean "wedged", never "busy",
    # because a kill under load is the worst possible response to load: the re-run
    # doubles it (2026-08-21, two jobs killed at 20 min and re-run). Contention is
    # governed by the label fence above, which is where it belongs.
    timeout-minutes: 60
    # PLAYWRIGHT_WORKERS is deliberately unset (→ 4 under CI): one preview server per worker
    # costs ~600 MB, and on an 8 GB Docker Desktop VM a server wedged mid-run at 4 workers
    # (#177). The runner VM now has 14 GB. If that ever recurs, pin PLAYWRIGHT_WORKERS: "2"
    # here — it is the dial, not the tests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
      wsproxy:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          APPEND_PORT: "postgres:5432"
          ALLOW_ADDR_REGEX: ".*"
        ports:
          - 5433:80
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup
      - name: Create app_user role (F0 bootstrap equivalent)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE app_user LOGIN PASSWORD 'app_user'"
      - name: Install Playwright browsers (no-op once the runner's /ci volume has them)
        run: pnpm --filter @repo/web-e2e exec playwright install --with-deps chromium
      - run: just e2e
      - if: always()
        run: bash .github/scripts/ci-status.sh e2e ${{ job.status }} >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: packages/web-e2e/playwright-report/
          if-no-files-found: ignore

  # Bash-only aggregator.
  ci-status:
    needs: [changes, checks, e2e]
    # `if: always()` so this job exists (and can fail) whatever happened above —
    # it is the aggregator whose PRESENCE the merge gate requires. Skipped is
    # NOT a pass here: every gate must be `success`, except e2e, which may be
    # `skipped` only when the `changes` job classified this PR `roadmap-only`
    # (a needs-result of `skipped` for any other reason fails this job, because
    # a job skipped by an `if:` reports SUCCESS to required checks).
    if: always()
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: bash .github/scripts/ci-summary.sh >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fail unless every gate succeeded (e2e may skip only on the roadmap-only lane)
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || needs.checks.result != 'success'
          || (needs.e2e.result != 'success' && !(needs.e2e.result == 'skipped' && needs.changes.outputs.lane == 'roadmap-only'))
        run: exit 1
