name: Claude Review

# Independent reviewer on every PR (agentic-ci Plan B, hand-rolled).
# Skips gracefully until the CLAUDE_CODE_OAUTH_TOKEN repo secret exists
# (generate with `claude setup-token`, store with `gh secret set`).
#
# Reviewer identity: with no `github_token` passed (this workflow passes none;
# `id-token: write` is the app-auth path) the action posts as `claude[bot]`,
# which is what the verdict gate below requires. A repo that connects a custom
# GitHub App (custom `github_token` / `bot_name`) must set the repo variable
# CLAUDE_REVIEWER_LOGIN to its own `<slug>[bot]`, or the verdict gate fails
# closed on every PR.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    # MOVED TO SELF-HOSTED on 2026-08-23 at Henrique's direct request, after the
    # account's Actions spending limit was reached and this job stopped starting:
    #
    #   "The job was not started because recent account payments have failed or
    #    your spending limit needs to be increased."
    #
    # THIS CARRIES A KNOWN RISK THAT THE PREVIOUS NOTE RECORDED, and it is not a
    # cost objection — it is technical. The original text:
    #
    #   "The review is Claude analysis + GitHub/Anthropic API only — no service
    #    containers, no workerd — so it runs on a GitHub-hosted runner rather
    #    than the self-hosted CI runner (whose DinD network blocks the action's
    #    API calls, leaving the review unable to post a verdict)."
    #
    # If that still holds, this job will run, reach the API, fail, post nothing,
    # and the verdict step will fail CLOSED with "No reviewer verdict found" —
    # which is the correct behaviour but indistinguishable at a glance from a
    # reviewer that genuinely declined. Two PRs in the 2026-08-20..23 run
    # (#163, #189) failed exactly that way while still hosted, so the signature
    # is already familiar and must not be misread as proof the move is fine.
    #
    # The PR that makes this change is its own test: a `pull_request` event runs
    # the workflow from the PR's own ref, so this job runs under the new label
    # before it is merged. If it posts a verdict, the DinD note is stale. If it
    # does not, revert this hunk — do NOT paper over it by relaxing the verdict
    # step, which is the one control that makes a green `review` mean anything.
    # `general`, not plain `self-hosted` (2026-08-26): this job is 5-9 min, and on
    # plain `self-hosted` it could land on the e2e-labelled runner and hold it. It
    # did — 18:41:50-18:50:07 on 2026-08-26, while an e2e job sat ready and queued
    # from 18:42:11, starting 4 seconds after this job released the runner. Only
    # `consumer-a-local-1` carries `general`; see recreate-runner.sh's FLEET SHAPE.
    runs-on: [self-hosted, general]
    timeout-minutes: 30
    steps:
      - name: Check for OAuth token
        id: token
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set - skipping Claude review"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request (#${{ github.event.pull_request.number }})
            as the consumer A repository reviewer. Read CLAUDE.md and
            docs/agentic-loop-playbook.md for conventions first.
            Focus on, in priority order: correctness bugs; tenant-isolation /
            RLS violations (every tenant table follows the F0 pattern; queries
            go through withTenant); permission bypasses (requireActiveOrg /
            requirePermission on every server entry point); tests weakened,
            skipped, or modified to pass; playbook convention violations.
            Post inline comments only for findings you are confident in. Then —
            REQUIRED — post ONE summary comment whose LAST line is exactly
            "Verdict: approve" or "Verdict: needs-work" (a downstream gate reads
            that line; if you post nothing the merge is blocked). Inline
            comments do NOT satisfy the gate, no matter how many you posted —
            the summary comment is a separate, always required step. Post it
            even when you found nothing at all (that is the "Verdict: approve"
            case). To post reliably: use the Write tool to write the full
            summary to /tmp/verdict.md, then run
            `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/verdict.md`.
            Do NOT build the comment with shell command substitution, heredocs,
            or pipes (e.g. `--body "$(...)"`) — the sandbox denies those, which
            is why past reviews silently failed to post. Write the file, then
            post it with the --body-file form above.
          # Write (to stage the verdict file) + Read/Grep/Glob (inspect code) +
          # gh pr comment --body-file (post without shell substitution, the form
          # the sandbox allows). The restrictive list silently dropped the post
          # on PR #9/#15 because a `--body "$(...)"` post is denied; --body-file
          # sidesteps that. The verdict gate below still fails closed if nothing lands.
          claude_args: '--allowedTools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)"'

      - name: Enforce reviewer verdict
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEWER_LOGIN: ${{ vars.CLAUDE_REVIEWER_LOGIN || 'claude[bot]' }}
        run: |
          # A PR that edits the reviewer workflow makes the action self-skip (it
          # refuses to run a workflow diff not yet on the default branch), so it
          # posts no verdict. Don't self-block those — the other five gates plus a
          # human still cover them; every other PR is hard-gated below.
          if gh pr diff "$PR" --name-only | grep -qx ".github/workflows/claude-review.yml"; then
            echo "::notice::PR modifies the review workflow; reviewer self-skips — verdict gate not enforced on this PR."
            exit 0
          fi
          # The verdict is read from THREE surfaces, because the reviewer does
          # not always use the one the prompt asks for: issue comments (the
          # `gh pr comment` form the prompt prescribes), PR review bodies (what
          # the inline-comment tool submits), and inline review comments. A
          # verdict posted on any of them counts; a run that posts none still
          # fails closed. Observed on PR #125: a review submitted with an EMPTY
          # body plus one inline comment and no issue comment — the old
          # issue-comments-only read reported "no verdict" and blocked a PR the
          # reviewer had in fact reviewed.
          #
          # Three hardening rules ride along, because widening the search widens
          # what a stale or quoted string could do:
          #   1. Only the LAST non-empty line of a comment can carry the verdict
          #      (exactly what the prompt demands). A substring match anywhere in
          #      the body let a quoted "Verdict: approve" — e.g. a PR that edits
          #      this very file — outrank the real "Verdict: needs-work" below it,
          #      since approve was tested first.
          #   2. Only comments newer than the head commit count. Otherwise an
          #      approve from a previous push satisfies the gate for a run whose
          #      reviewer errored out and posted nothing.
          #   3. Identity is exact: login must equal the reviewer app's bot login
          #      (default claude[bot], overridable via repo variable
          #      CLAUDE_REVIEWER_LOGIN) AND user.type must be Bot. The old
          #      case-insensitive substring match accepted any human handle
          #      containing "claude" and any third-party "*claude*[bot]" app.
          #      GitHub usernames cannot contain "[" or "]", so an exact
          #      "<slug>[bot]" login cannot be produced by a user account.
          #      performed_via_github_app is deliberately NOT checked — GitHub
          #      returns it only on issue comments, not on reviews or inline
          #      review comments (observed 2026-08-25), so a gate on it would
          #      reject two of the three surfaces.
          head_ts=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.committer.date')
          if [ -z "$head_ts" ]; then
            echo "::error::Could not read the head commit timestamp — failing closed."
            exit 1
          fi
          verdict=$(
            {
              gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq '.[] | {t: .created_at, u: .user.login, ty: .user.type, b: .body}'
              gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                --jq '.[] | {t: .submitted_at, u: .user.login, ty: .user.type, b: .body}'
              gh api "repos/$REPO/pulls/$PR/comments" --paginate \
                --jq '.[] | {t: .created_at, u: .user.login, ty: .user.type, b: .body}'
            } | jq -rs --arg who "$REVIEWER_LOGIN" --arg since "$head_ts" '
                  [ .[]
                    | select(.u == $who and .ty == "Bot")
                    | select(.t != null and .t > $since)
                    | select(.b != null and .b != "")
                    | .last = ( .b | split("\n") | map(sub("\r$"; ""))
                                | map(select(test("[^[:space:]]"))) | last // "" )
                    | select(.last | test("^[[:space:]]*\\**[[:space:]]*verdict[[:space:]]*:[[:space:]]*(approve|needs-work)[[:space:]]*\\**[[:space:]]*\\.?[[:space:]]*$"; "i"))
                  ]
                  | sort_by(.t) | last | if . == null then "" else .last end'
          )
          if [ -z "$verdict" ]; then
            echo "::error::No verdict from reviewer '$REVIEWER_LOGIN' (user.type Bot) newer than head $HEAD_SHA — failing closed. Re-run the review or investigate why it did not post. If the reviewer posts under a different login (custom github_token app), set repo variable CLAUDE_REVIEWER_LOGIN."
            exit 1
          elif printf '%s' "$verdict" | grep -qiE "needs-work"; then
            echo "::error::Reviewer verdict is needs-work — address the blocking findings and push before merge."
            exit 1
          else
            echo "✅ Reviewer approved."
          fi
