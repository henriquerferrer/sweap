name: audit-gate

# Scaffolded by sweap (scaffold.sh / /agentic-loop-init). This is the ONLY
# surface that validates an audit record against the state it will actually
# land in — the local pre-merge hook cannot, because the record being
# discharged is by definition not merged yet (see hooks/audit-gate.sh, "WHY
# PATH LEVEL IS ALL THIS MODE CAN DO").
#
# Make this a REQUIRED check IF YOUR PLAN ALLOWS ONE. Branch protection and
# rulesets are paid for private repos: on Free both APIs 403 with "Upgrade to
# GitHub Pro or make this repository public". There, this job is still the
# enforcement point — pre-merge-gate.sh refuses any `gh pr merge` whose check
# rollup is not fully green, and this job is in that rollup. A merge from the
# GitHub web UI bypasses that local hook and is caught after the fact by
# post-merge-auditcheck.sh. See the playbook, "Enforcing the audit gate in CI".
#
# Hard-won rules (research memo, 2026-08-08 — do not "optimize" any of them away):
#   - NEVER put this job behind a `paths:` filter or a job-level `if:`. A job
#     skipped by an `if:` reports SUCCESS and SATISFIES the required check
#     (GitHub-documented). It always runs; the gate is seconds.
#   - Pin the required check to the GitHub Actions app in the ruleset, never
#     "any source": a commit status can be posted green by any push-access
#     token, while check runs are App-only.
#   - Keep the default GITHUB_TOKEN read-only — otherwise the actor can edit the
#     validator out of its own way. (Path-protecting this file needs an
#     org-scoped push ruleset, unavailable to a personal repo on any plan.)
#
# WHY IT EXISTS: on 2026-08-11 a consumer repo merged a malformed audit record
# and then authored a whole new milestone on top of the undischarged debt. Every
# local control was version-skewed (a stale plugin cache had no gate at all).
# A check pinned in the repo cannot be stale-cached — that is the point.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit-gate:
    # Deliberately pinned to a HOSTED runner, unlike ci.yml's jobs which follow
    # vars.RUNNER_LABEL. This gate needs nothing but bash + git — no toolchain,
    # no services, no database — so it costs nothing hosted, while a REQUIRED
    # check that runs on self-hosted capacity cannot start when that runner is
    # down and then blocks every PR in the repo. (consumer A's self-hosted runner is
    # a container that crash-loops on runner-token expiry; its claude-review job
    # is pinned hosted for exactly this reason.) A gate whose availability
    # depends on infrastructure it is meant to police is not a gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # the gate recomputes ancestry — it needs real history

      # The gate is VENDORED into this repo at .github/scripts/ by sweap's
      # scaffold (audit-gate.sh + the roadmap-lint.sh it shells out to), and
      # kept byte-identical to the plugin's copy on every session start.
      #
      # It is vendored rather than checked out from sweap because a cross-repo
      # checkout of a private repo needs a PAT in every consumer repo, and a
      # required check that dies when a token expires blocks every PR — the same
      # "gate depends on infrastructure it polices" failure as pinning it to a
      # self-hosted runner. Vendored, the check has no auth, no network and no
      # cross-repo dependency: it cannot be stale-cached, mis-authed, or taken
      # down by someone else's outage. Protect .github/scripts/** exactly like
      # .github/workflows/**.
      - name: audit gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          GATE=.github/scripts/audit-gate.sh
          if [ ! -f "$GATE" ]; then
            echo "::error::$GATE is missing — the audit gate cannot run. Start a Claude Code session in this repo (sweap's scaffold vendors it) or run /agentic-loop-init."
            exit 1
          fi

          # Anchor for "already merged" (pre-format records are inherited, not
          # authored — see record_is_legacy). On a PR that is the target branch;
          # on a push to main it is main itself.
          BASE="${BASE_REF:-main}"
          git fetch -q --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          export SWEAP_MAIN_REF="origin/${BASE}"

          # Repo-state check: every record under audits/ is valid and no complete
          # milestone is missing one. On a PR this runs against the PR's own
          # content, which is what catches a malformed record BEFORE it merges.
          bash "$GATE" --check

          # Merge classification: does this PR advance the backlog without
          # discharging outstanding debt? NUL-delimited — a filename containing a
          # literal newline must not be able to split into a fake record path.
          if [ -n "${BASE_REF:-}" ]; then
            mapfile -d '' CHANGED < <(git diff --name-only -z "origin/${BASE}...HEAD")
            if [ "${#CHANGED[@]}" -gt 0 ]; then
              bash "$GATE" --files "${CHANGED[@]}"
            fi
          fi
