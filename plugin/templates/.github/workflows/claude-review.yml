name: Claude Review

# Scaffolded by sweap's /agentic-loop-init. Independent reviewer on every PR
# (agentic-ci Plan B, hand-rolled). Skips gracefully until the
# CLAUDE_CODE_OAUTH_TOKEN repo secret exists (generate with
# `claude setup-token`, store with `gh secret set`).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Check for OAuth token
        id: token
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set - skipping Claude review"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        if: steps.token.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request (#${{ github.event.pull_request.number }})
            as this repository's reviewer. Read CLAUDE.md first (including the
            `## sweap config` block and standing preferences) and, if this PR's
            roadmap item carries `review-dimensions` tags, honor those too.
            Focus on, in priority order: correctness bugs; authorization /
            access-control bypasses (permission checks on every server entry
            point, tenant/ownership boundaries on every query); tests weakened,
            skipped, or modified to pass; CLAUDE.md / playbook convention
            violations. Post inline comments only for findings you are
            confident in. Then — REQUIRED — post ONE summary comment whose
            LAST line is exactly "Verdict: approve" or "Verdict: needs-work"
            (a downstream gate greps the posted comment for that line; if you
            post nothing the merge is blocked). To post reliably: use the
            Write tool to write the full summary to /tmp/verdict.md, then run
            `gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/verdict.md`.
            Do NOT build the comment with shell command substitution, heredocs,
            or pipes (e.g. `--body "$(...)"`) — the sandbox denies those, which
            is why past reviews silently failed to post. Write the file, then
            post it with the --body-file form above.
          # Write (to stage the verdict file) + Read/Grep/Glob (inspect code) +
          # gh pr comment --body-file (post without shell substitution, the form
          # the sandbox allows). The restrictive list avoids a `--body "$(...)"`
          # post being denied — --body-file sidesteps that. The verdict gate
          # below still fails closed if nothing lands.
          claude_args: '--allowedTools "Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)"'

      - name: Enforce reviewer verdict
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # A PR that edits the reviewer workflow makes the action self-skip (it
          # refuses to run a workflow diff not yet on the default branch), so it
          # posts no verdict. Don't self-block those — the other gates plus a
          # human still cover them; every other PR is hard-gated below.
          if gh pr diff "$PR" --name-only | grep -qx ".github/workflows/claude-review.yml"; then
            echo "::notice::PR modifies the review workflow; reviewer self-skips — verdict gate not enforced on this PR."
            exit 0
          fi
          body=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq '[.[] | select(.user.login | test("claude"))] | last | .body // ""')
          if printf '%s' "$body" | grep -qiE "Verdict:[[:space:]]*approve"; then
            echo "✅ Reviewer approved."
          elif printf '%s' "$body" | grep -qiE "Verdict:[[:space:]]*needs-work"; then
            echo "::error::Reviewer verdict is needs-work — address the blocking findings and push before merge."
            exit 1
          else
            echo "::error::No reviewer verdict found — failing closed. Re-run the review or investigate why it did not post."
            exit 1
          fi
